<style>
  :root {
    --gap: 14px;
    --radius: 18px;
    --bg: #f3f1ec;
  }
 
  * { box-sizing: border-box; }
 
  body {
    margin: 0;
    padding: 40px 20px;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
 
  .bento {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-auto-rows: auto;
    align-items: start;
    gap: var(--gap);
  }
 
  .cell {
    position: relative;
    overflow: hidden;
    border-radius: var(--radius);
    background: #ddd;
    cursor: pointer;
  }
 
  .cell img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.5s ease;
  }
 
  .cell:hover img {
    transform: scale(1.06);
  }
 
  /* control each tile's width here — height follows the image's natural ratio */
  .cell.a { grid-column: span 3; }
  .cell.b { grid-column: span 3; }
  .cell.c { grid-column: span 2; }
  .cell.d { grid-column: span 2; }
  .cell.e { grid-column: span 2; }
  .cell.f { grid-column: span 3; }
  .cell.g { grid-column: span 3; }
  .cell.h { grid-column: span 4; }
  .cell.i { grid-column: span 2; }
 
  @media (max-width: 720px) {
    .bento {
      grid-template-columns: repeat(2, 1fr);
    }
    .cell.a, .cell.b, .cell.c, .cell.d,
    .cell.e, .cell.f, .cell.g, .cell.h, .cell.i {
      grid-column: span 1;
    }
  }
</style>

</head>
